name: CI
# Las pruebas corren solo al subir a main, una vez, y una subida nueva cancela la anterior (PROTOCOLO_CORE §8).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-main
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-timeout=180000
